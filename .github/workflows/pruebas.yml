# Pruebas automáticas en cada cambio: recorridos principales y accesibilidad, en Chromium, Firefox y móvil.
name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      # Sin tarjeta de sonido, el reloj de audio de Firefox no avanza y el barrido del test no se mueve:
      # una salida de sonido virtual hace de altavoz, como en un equipo normal.
      - name: Salida de sonido virtual
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=virtual
          pactl set-default-sink virtual
      - run: npx playwright test
